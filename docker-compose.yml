services:
  homeassistant:
    container_name: homeassistant
    build:
      context: .
      args:
        HA_VERSION: 2026.11.1
    image: ha-redesign:2026.11.1
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    network_mode: host
    privileged: true
